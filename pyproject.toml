[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clickwheel"
version = "0.1.0"
description = "A CLI for syncing a music library to a classic iPod from a modern Mac"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Pat Dugan" }]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "tqdm>=4.65",
    "mutagen>=1.47",
]

[project.scripts]
clickwheel = "clickwheel.cli:app"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["clickwheel"]
