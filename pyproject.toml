[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clickwheel"
dynamic = ["version"]
description = "Sync your music library to a classic iPod from a modern Mac"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Pat Dugan" }]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "tqdm>=4.65",
    "mutagen>=1.47",
    "pylast>=5.0",
    "questionary>=2.0",
]

[project.urls]
Homepage = "https://github.com/pdugan20/clickwheel"
Repository = "https://github.com/pdugan20/clickwheel"
Issues = "https://github.com/pdugan20/clickwheel/issues"
Changelog = "https://github.com/pdugan20/clickwheel/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The `fix` command no longer needs any extras — MusicBrainz/CAA/
# Last.fm work natively via base dependencies. The empty extra is
# kept so existing `pip install 'clickwheel[fix]'` / `pipx inject`
# commands in users' setup scripts don't error out.
fix = []
artwork = [
    "Pillow>=10.0",
    "numpy>=1.24",
]
mcp = [
    "mcp>=1.2",
]
plex = [
    "plexapi>=4.18",
]
applemusic = [
    "pyjwt[crypto]>=2.8",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.15",
    "mypy>=1.13",
    "build>=1.0",
]

[project.scripts]
clickwheel = "clickwheel.cli:app"
clickwheel-mcp = "clickwheel.mcp:main"

[tool.hatch.version]
path = "clickwheel/__init__.py"

[tool.pytest.ini_options]
addopts = "--cov=clickwheel --cov-report=term-missing --cov-fail-under=30"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["clickwheel/ipod/*"]

[tool.ruff]
target-version = "py311"
line-length = 88
# clickwheel/ipod/ is vendored iOpenPodv2.
# clickwheel/mcp/_ui_bundles.py is auto-generated by web/scripts/inline_bundles.mjs;
# its line-length, quoting, and string-concat style aren't worth bickering with
# ruff over. The pre-commit hook already excluded it; this lets `ruff format
# --check clickwheel/` (run in CI) skip it too.
exclude = ["clickwheel/ipod/", "clickwheel/mcp/_ui_bundles.py"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, N naming, UP pyupgrade,
# B bugbear, C4 comprehensions, SIM simplify, PT pytest-style, RUF ruff-native.
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "PT", "RUF"]
ignore = [
    # clickwheel uses en/em dashes deliberately in user-facing strings and
    # docstrings; the "ambiguous unicode" rules are noise here.
    "RUF001",
    "RUF002",
    # try/except/pass reads fine; contextlib.suppress isn't clearly better and
    # would require an import in modules that don't otherwise need one.
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
# Typer (CLI) and pydantic/FastMCP (MCP tools) idiomatically use function calls
# as parameter defaults — typer.Option(...), Field(...) inside Annotated[...].
# B008 (function-call-in-default-argument) flags those, but they're correct.
"clickwheel/cli.py" = ["B008"]
"clickwheel/mcp/tools/*" = ["B008"]
# Opinionated pytest-style/format rules that don't catch bugs — not worth
# churning the existing suite over; new code still gets the rest of the rules.
"tests/*" = ["PT011", "PT017", "PT018", "PT019", "RUF012", "RUF015", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["clickwheel"]

[tool.mypy]
python_version = "3.11"
# Several runtime deps ship no type stubs (mutagen, pylast, tqdm, questionary,
# plexapi). Silence missing-stub noise rather than vendor stubs; tighten later.
ignore_missing_imports = true
# Vendored iOpenPodv2 and the generated MCP Apps bundle are not ours to type.
exclude = ['clickwheel/ipod/', 'clickwheel/mcp/_ui_bundles\.py']

# Gradual typing ratchet: mypy is enforced on every module EXCEPT those listed
# below, which carry pre-existing type debt. Drive the list down over time —
# remove a module once it's clean. Do NOT add new modules here; new code is
# expected to type-check.
[[tool.mypy.overrides]]
module = [
    "clickwheel.actions",
    "clickwheel.artwork",
    "clickwheel.cli",
    "clickwheel.library",
    "clickwheel.scrobble",
    "clickwheel.mcp._runtime",
    "clickwheel.mcp.tools.*",
]
ignore_errors = true
