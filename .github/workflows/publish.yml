name: Publish

# release-please creates the GitHub release. This workflow accepts only an exact
# SemVer tag whose commit is still reachable from the protected default branch.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify protected-history release tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Production releases require an exact vX.Y.Z tag."
            exit 1
          fi
          remote=$(git remote get-url origin)
          if [ "${remote%.git}" != "https://github.com/${GITHUB_REPOSITORY}" ]; then
            echo "::error::Checkout origin is not the triggering repository."
            exit 1
          fi

          git fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          if ! git merge-base --is-ancestor \
            "${commit}" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "::error::Release tag is not reachable from current protected history."
            exit 1
          fi

          tag=${GITHUB_REF#refs/tags/v}
          version=$(sed -nE 's/^__version__ = "([^"]+)".*$/\1/p' clickwheel/__init__.py)
          if [ "${tag}" != "${version}" ]; then
            echo "::error::Tag ${tag} does not match package version ${version}."
            exit 1
          fi

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: '0.11.17'
      - name: Build package
        run: uv run --locked --extra dev python -m build --no-isolation
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
