name: Test Publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Qualified tag ref or exact commit SHA to publish'
        required: true

permissions:
  contents: read

jobs:
  resolve-build:
    name: Resolve and Build TestPyPI Artifact
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - name: Check out the protected default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve exact same-repository source
        id: source
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          requested=${REQUESTED_REF}
          remote=$(git remote get-url origin)
          if [ "${remote%.git}" != "https://github.com/${GITHUB_REPOSITORY}" ]; then
            echo "::error::Checkout origin is not the triggering repository."
            exit 1
          fi

          if [[ "${requested}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            remote_object=$(git ls-remote --refs origin "${requested}")
            if [ "$(wc -l <<<"${remote_object}" | tr -d ' ')" -ne 1 ]; then
              echo "::error::Qualified tag does not uniquely exist in this repository."
              exit 1
            fi
            remote_sha=${remote_object%%[[:space:]]*}
            peeled=$(git ls-remote origin "${requested}^{}")
            expected_commit=${peeled%%[[:space:]]*}
            if [ -z "${expected_commit}" ]; then
              expected_commit=${remote_sha}
            fi
            git fetch --force --no-tags origin "${requested}"
          elif [[ "${requested}" =~ ^[0-9a-f]{40}$ ]]; then
            expected_commit=${requested}
            git fetch --force --no-tags origin "${requested}"
          else
            echo "::error::Source must be refs/tags/vX.Y.Z or a lowercase 40-character commit SHA."
            exit 1
          fi

          resolved=$(git rev-parse "FETCH_HEAD^{commit}")
          if [ "${resolved}" != "${expected_commit}" ]; then
            echo "::error::Requested source did not resolve to the fetched repository object."
            exit 1
          fi
          if [[ "${requested}" =~ ^[0-9a-f]{40}$ ]] && [ "${resolved}" != "${requested}" ]; then
            echo "::error::Commit input did not resolve to that exact commit."
            exit 1
          fi
          echo "commit=${resolved}" >>"${GITHUB_OUTPUT}"

      - name: Check out the resolved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.commit }}

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: '0.11.17'
      - name: Build package
        run: uv run --locked --extra dev python -m build --no-isolation

      - name: Upload immutable distribution artifact
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testpypi-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

  publish:
    name: Publish Immutable Artifact to TestPyPI
    needs: resolve-build
    if: >-
      needs.resolve-build.result == 'success' &&
      needs.resolve-build.outputs.artifact-id != '' &&
      needs.resolve-build.outputs.artifact-digest != ''
    permissions:
      actions: read
      id-token: write
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - name: Download exact verified distribution artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.resolve-build.outputs.artifact-id }}
          path: dist
          digest-mismatch: error

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
