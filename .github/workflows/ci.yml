name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shfmt
        run: |
          SHFMT_VERSION=3.10.0
          curl -sS -L "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt
      - name: Check formatting
        run: shfmt -d scripts/*.sh

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            **/*.md
            !CHANGELOG.md

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Prettier check
        run: npx prettier@3 --check '**/*.{json,yml,yaml,md}' --ignore-path .prettierignore

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: pip install ruff
      - name: Check linting
        run: ruff check clickwheel/
      - name: Check formatting
        run: ruff format --check clickwheel/

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e ".[dev,mcp]"
      - name: Type check
        run: mypy clickwheel

  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        # [mcp] is included so the MCP test suite actually runs — without
        # it, test_mcp_server.py is skipped wholesale via importorskip.
        run: pip install -e ".[dev,mcp]"
      - name: Run tests with coverage
        run: python -m pytest tests/ -v --tb=short --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          fail_ci_if_error: false

  claude-lint:
    name: Claude Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run claude-code-lint
        run: npx claude-code-lint@latest

  web-lint:
    name: Web Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          # Pinned via .nvmrc so CI and local builds produce byte-identical
          # bundle output (Vite hashes are content-addressed but plugin
          # versions can drift across major Node releases).
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Type-check
        working-directory: web
        run: npm run typecheck
      - name: ESLint
        working-directory: web
        run: npm run lint -- --max-warnings=0
      - name: Prettier (web/)
        working-directory: web
        run: npm run format:check

  # The MCP Apps bundle (clickwheel/mcp/_ui_bundles.py) is auto-generated
  # from web/*.html via Vite. We commit it so `pip install clickwheel`
  # works without a Node toolchain — but that only holds if every commit
  # ships a fresh bundle. This job rebuilds the bundle and fails if the
  # checked-in version drifted from the source. Fix: run `make build-web`
  # locally and amend the commit.
  web-bundle:
    name: Web Bundle Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          # Pinned via .nvmrc so CI and local builds produce byte-identical
          # bundle output (Vite hashes are content-addressed but plugin
          # versions can drift across major Node releases).
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Rebuild bundles
        working-directory: web
        run: npm run build:bundles
      - name: Verify checked-in bundle matches source
        run: |
          if ! git diff --exit-code -- clickwheel/mcp/_ui_bundles.py; then
            echo
            echo "::error ::clickwheel/mcp/_ui_bundles.py is stale."
            echo "Run 'make build-web' locally and commit the regenerated bundle."
            exit 1
          fi
