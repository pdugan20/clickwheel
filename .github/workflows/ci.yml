name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh .github/scripts/install-shfmt.sh

  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shfmt
        run: .github/scripts/install-shfmt.sh
      - name: Check formatting
        run: shfmt -d scripts/*.sh .github/scripts/install-shfmt.sh

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: |
            **/*.md
            !CHANGELOG.md
            !docs/superpowers

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
      - name: Run Prettier check
        run: tools/ci/node_modules/.bin/prettier --check '**/*.{json,yml,yaml,md}' --ignore-path .prettierignore

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: '0.11.17'
      - name: Check linting
        run: uv run --locked --extra dev ruff check clickwheel/
      - name: Check formatting
        run: uv run --locked --extra dev ruff format --check clickwheel/

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: '0.11.17'
      - name: Type check
        run: uv run --locked --extra dev --extra mcp mypy clickwheel

  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: '0.11.17'
      - name: Run tests with coverage
        # [mcp] extra so the MCP suite runs — without it, test_mcp_server.py is
        # skipped wholesale via importorskip.
        run: >-
          uv run --locked --python ${{ matrix.python-version }}
          --extra dev --extra mcp
          pytest tests/ -v --tb=short --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: coverage.xml
          fail_ci_if_error: false

  docs-reference:
    name: Docs Reference Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: '0.11.17'
      - name: Regenerate the CLI + MCP reference + changelog from source
        run: |
          uv run --locked --extra mcp python scripts/gen-cli-reference.py
          uv run --locked --extra mcp python scripts/gen-mcp-reference.py
          uv run --locked python scripts/gen-changelog.py
      - name: Fail if the generated reference drifted from the code
        run: git diff --exit-code docs-mintlify/reference/cli/ docs-mintlify/reference/mcp-tools/ docs-mintlify/changelog.mdx

  docs-links:
    name: Docs Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
      - name: Check for broken links
        run: cd docs-mintlify && ../tools/ci/node_modules/.bin/mint broken-links

  claude-lint:
    name: Claude Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
      - name: Run claude-code-lint
        run: tools/ci/node_modules/.bin/claudelint

  web-lint:
    name: Web Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pinned via .nvmrc so CI and local builds produce byte-identical
          # bundle output (Vite hashes are content-addressed but plugin
          # versions can drift across major Node releases).
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Type-check
        working-directory: web
        run: npm run typecheck
      - name: ESLint
        working-directory: web
        run: npm run lint -- --max-warnings=0
      - name: Prettier (web/)
        working-directory: web
        run: npm run format:check

  # The MCP Apps bundle (clickwheel/mcp/_ui_bundles.py) is auto-generated
  # from web/*.html via Vite. We commit it so `pip install clickwheel`
  # works without a Node toolchain — but that only holds if every commit
  # ships a fresh bundle. This job rebuilds the bundle and fails if the
  # checked-in version drifted from the source. Fix: run `make build-web`
  # locally and amend the commit.
  web-bundle:
    name: Web Bundle Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pinned via .nvmrc so CI and local builds produce byte-identical
          # bundle output (Vite hashes are content-addressed but plugin
          # versions can drift across major Node releases).
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Rebuild bundles
        working-directory: web
        run: npm run build:bundles
      - name: Verify checked-in bundle matches source
        run: |
          if ! git diff --exit-code -- clickwheel/mcp/_ui_bundles.py; then
            echo
            echo "::error ::clickwheel/mcp/_ui_bundles.py is stale."
            echo "Run 'make build-web' locally and commit the regenerated bundle."
            exit 1
          fi
