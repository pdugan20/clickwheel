version: 2
updates:
  - package-ecosystem: 'github-actions'
    cooldown: { default-days: 14 }
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 0

  - package-ecosystem: 'npm'
    cooldown: { default-days: 7 }
    directory: '/web'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:10'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 0

  - package-ecosystem: 'uv'
    cooldown: { default-days: 7 }
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:20'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 0

  - package-ecosystem: 'npm'
    cooldown: { default-days: 7 }
    directory: '/tools/ci'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:30'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 0

  - package-ecosystem: 'npm'
    cooldown: { default-days: 7 }
    directory: '/apex-worker'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:40'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 0
