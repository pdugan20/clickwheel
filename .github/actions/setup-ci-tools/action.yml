name: Setup locked CI tools
description: Install the exact npm tools recorded in tools/ci/package-lock.json

runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: '.nvmrc'
        cache: npm
        cache-dependency-path: tools/ci/package-lock.json
    - name: Install locked CI tools
      shell: bash
      run: npm ci --ignore-scripts --prefix tools/ci
