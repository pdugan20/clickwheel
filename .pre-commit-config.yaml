repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        # MCP Apps bundle is a Vite single-file build of React + the
        # ext-apps SDK; ~500-600 KB is normal. Bump the threshold and
        # let the bundle through.
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck
        language: system
        entry: shellcheck
        types: [shell]
      - id: shfmt
        name: shfmt
        language: system
        entry: shfmt -d
        types: [shell]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: ['--fix']
        exclude: '^(clickwheel/ipod/|clickwheel/mcp/_ui_bundles\.py$)'
      - id: ruff-format
        exclude: '^(clickwheel/ipod/|clickwheel/mcp/_ui_bundles\.py$)'

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-no-log-warn
        # Bundled JS contains console.warn / .warn( strings from React
        # devtools — not Python logger calls. Skip the auto-generated
        # bundle module to keep this hook useful for real Python code.
        exclude: '^clickwheel/mcp/_ui_bundles\.py$'
      - id: text-unicode-replacement-char

  - repo: local
    hooks:
      - id: no-direct-console-print
        name: No direct console.print() in CLI
        language: pygrep
        entry: 'console\.print\('
        files: '^clickwheel/(?!output\.py).*\.py$'
        exclude: '^clickwheel/ipod/(itunesdb_parser|itunesdb_writer|artworkdb_writer)/'
        types: [python]
      - id: no-direct-table
        name: Use output.table() not Table() directly
        language: pygrep
        entry: '= Table\('
        files: '^clickwheel/(?!output\.py).*\.py$'
        exclude: '^clickwheel/ipod/'
        types: [python]
      - id: no-manual-version-bump
        name: No manual version bumps (release-please owns __version__)
        language: script
        entry: scripts/no-manual-version-bump.sh
        files: '^(clickwheel/__init__\.py|\.release-please-manifest\.json)$'
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [json, yaml, markdown, ts, tsx, javascript]
        exclude: '^(clickwheel/mcp/_ui_bundles\.py|web/dist/|clickwheel/ipod/)'

  - repo: local
    hooks:
      - id: eslint-web
        name: ESLint (web bundles)
        language: system
        entry: bash -c 'cd web && npm run --silent lint -- --max-warnings=0'
        files: '^web/.*\.(ts|tsx|js|mjs)$'
        pass_filenames: false
      - id: typecheck-web
        name: tsc (web bundles)
        language: system
        entry: bash -c 'cd web && npm run --silent typecheck'
        files: '^web/.*\.(ts|tsx)$'
        pass_filenames: false

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint

  - repo: local
    hooks:
      - id: commitlint
        name: commitlint
        language: node
        entry: commitlint --edit
        stages: [commit-msg]
        always_run: true
        additional_dependencies:
          - '@commitlint/cli@20'
          - '@commitlint/config-conventional@20'
